$kind: http-request
name: 'Admin Only - Admin Token (expect 200)'
url: '{{base_url}}/auth/admin-only'
method: GET
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Token role is ADMIN", function () {
          const authHeader = pm.request.headers.get("Authorization");
          if (authHeader && authHeader.startsWith("Bearer ")) {
              const token = authHeader.split(" ")[1];
              const payload = JSON.parse(atob(token.split(".")[1]));
              pm.expect(payload.role).to.eql("ADMIN");
              console.log("✅ Fresh token with role =", payload.role, "→ server returns 200");
          }
      });

      pm.test("Response body is not empty", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
