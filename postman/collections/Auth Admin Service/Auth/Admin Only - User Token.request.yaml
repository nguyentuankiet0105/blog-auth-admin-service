$kind: http-request
name: 'Admin Only - User Token (expect 403)'
url: '{{base_url}}/auth/admin-only'
method: GET
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Response has forbidden message", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
      });

      // Demonstrate stale permission: token still carries role: USER
      pm.test("Token role is USER (stale permission demo)", function () {
          const authHeader = pm.request.headers.get("Authorization");
          if (authHeader && authHeader.startsWith("Bearer ")) {
              const token = authHeader.split(" ")[1];
              const payload = JSON.parse(atob(token.split(".")[1]));
              pm.expect(payload.role).to.eql("USER");
              console.log("🔒 Stale permission: token role =", payload.role, "→ server correctly returns 403");
          }
      });
