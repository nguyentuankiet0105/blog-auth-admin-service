$kind: http-request
url: "{{base_url}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refresh_token}}"
    }
order: 3000
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.collectionVariables.set('access_token', res.accessToken);
      pm.collectionVariables.set('refresh_token', res.refreshToken);

      pm.test('200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test('có đủ 2 token', () => {
        pm.expect(res).to.have.property('accessToken');
        pm.expect(res).to.have.property('refreshToken');
      });
      pm.test('không lộ password', () => {
        pm.expect(res.user).to.not.have.property('password');
      });
    language: text/javascript
